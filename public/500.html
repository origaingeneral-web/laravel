<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>500 - Server Error</title>
    <style>
      :root {
        color-scheme: light;
        --background: #ffffff;
        --foreground: #18181b;
        --muted: #71717a;
        --border: #e4e4e7;
        --primary: #3b82f6;
        --danger: #dc2626;
        --danger-soft: #fef2f2;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --background: #09090b;
          --foreground: #fafafa;
          --muted: #a1a1aa;
          --border: #27272a;
          --danger-soft: rgba(220, 38, 38, 0.12);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
        background: var(--background);
        color: var(--foreground);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: 100%;
        max-width: 640px;
        text-align: center;
      }

      img {
        max-height: 160px;
        max-width: 100%;
        margin-bottom: 40px;
      }

      .dark-image {
        display: none;
      }

      @media (prefers-color-scheme: dark) {
        .light-image {
          display: none;
        }

        .dark-image {
          display: inline-block;
        }
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 24px;
        margin-bottom: 12px;
        padding: 0 10px;
        border: 1px solid rgba(220, 38, 38, 0.2);
        border-radius: 6px;
        background: var(--danger-soft);
        color: var(--danger);
        font-size: 12px;
        font-weight: 600;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.2;
        font-weight: 600;
      }

      p {
        margin: 0 auto 40px;
        max-width: 520px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        border-radius: 8px;
        background: var(--primary);
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="light-image"
        src="/media/illustrations/20.svg"
        alt="Server error"
      />
      <img
        class="dark-image"
        src="/media/illustrations/20-dark.svg"
        alt="Server error"
      />

      <div class="badge">500 Error</div>
      <h1>Internal Server Error</h1>
      <p>
        Server error occurred. Please try again later or contact support for
        assistance.
      </p>
      <a href="/dashboard">Back to Home</a>
    </main>
  </body>
</html>
